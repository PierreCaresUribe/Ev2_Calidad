<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liquidaciones - RRHH</title>
  <link rel="stylesheet" href="../../css/styles.css"/>
</head>
<body>
  <header>
    <h1>ERP Seguridad LTDA</h1>
    <nav><a href="../../index.html">Inicio</a> <a href="index.html">RRHH</a></nav>
  </header>
  <main>
    <h2>Generación de Liquidaciones de Sueldo</h2>
    <form>
      <label>Empleado</label>
      <select><option>Seleccione...</option><option>Juan Pérez</option><option>María González</option></select>
      <label>Período (mes/año)</label><input type="month"/>
      <label>Sueldo base</label><input type="number" placeholder="500000"/>
      <label>Horas extras</label><input type="number" placeholder="0"/>
      <label>Bono</label><input type="number" placeholder="0"/>
      <label>Días de licencia</label><input type="number" placeholder="0"/>
      <button type="submit">Generar Liquidación</button>
    </form>
    <br/>
    <h3>Liquidaciones Generadas</h3>
    <table>
      <tr><th>Empleado</th><th>Período</th><th>Sueldo Bruto</th><th>Descuentos</th><th>Sueldo Líquido</th><th>Acción</th></tr>
      <tr><td>Juan Pérez</td><td>Abril 2024</td><td>$500.000</td><td>$85.000</td><td>$415.000</td><td><button>Imprimir</button></td></tr>
      <tr><td>María González</td><td>Abril 2024</td><td>$650.000</td><td>$110.500</td><td>$539.500</td><td><button>Imprimir</button></td></tr>
    </table>
  </main>
</body>
</html>
