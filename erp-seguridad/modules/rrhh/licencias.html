<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Licencias Médicas - RRHH</title>
  <link rel="stylesheet" href="../../css/styles.css"/>
</head>
<body>
  <header>
    <h1>ERP Seguridad LTDA</h1>
    <nav><a href="../../index.html">Inicio</a> <a href="index.html">RRHH</a></nav>
  </header>
  <main>
    <h2>Registro de Licencias Médicas</h2>
    <form>
      <label>Empleado</label>
      <select><option>Seleccione...</option><option>Juan Pérez</option><option>María González</option></select>
      <label>Tipo de licencia</label>
      <select><option>Enfermedad común</option><option>Accidente laboral</option><option>Maternidad</option><option>Paternidad</option></select>
      <label>Fecha inicio</label><input type="date"/>
      <label>Fecha término</label><input type="date"/>
      <label>Días</label><input type="number" placeholder="0"/>
      <label>Diagnóstico</label><textarea rows="2" placeholder="Descripción del diagnóstico..."></textarea>
      <button type="submit">Registrar Licencia</button>
    </form>
    <br/>
    <h3>Licencias Registradas</h3>
    <table>
      <tr><th>Empleado</th><th>Tipo</th><th>Inicio</th><th>Término</th><th>Días</th><th>Estado</th></tr>
      <tr><td>Juan Pérez</td><td>Enfermedad común</td><td>10/04/2024</td><td>14/04/2024</td><td>5</td><td>Aprobada</td></tr>
    </table>
  </main>
</body>
</html>
